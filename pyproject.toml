[project]
name = "backtester"
version = "0.1.0"
description = "Aptenodytes event-driven backtester (Python oracle + C++ bindings)"
requires-python = ">=3.10"
dependencies = [
    "yfinance",
    "pandas",
    "pyarrow",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy", "nanobind"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/backtester"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
pythonpath = ["python"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
ignore_missing_imports = true
